name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux x86_64 is one of the two platforms nearcore ships a sandbox
    # binary for. No secrets: everything runs against the local sandbox.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Unit tests
        run: cargo test --workspace --exclude sandbox-tests --locked
      - name: Client tests
        working-directory: client
        run: npm test
      - name: Sandbox tests
        run: scripts/test-sandbox.sh --locked
      - name: Client against the contracts
        run: scripts/test-client.sh --locked
      # cargo hides a passing test's output; these are the lines the README
      # quotes.
      - name: Demo verdict lines
        run: scripts/test-sandbox.sh --locked --test demo -- --nocapture --test-threads 1
      - name: Clippy
        run: NEAR_SANDBOX_BIN_PATH="$(scripts/sandbox-bin.sh)" cargo clippy --workspace --all-targets --locked -- -D warnings

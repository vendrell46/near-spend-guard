name: Container line

# scripts/test-container.sh from a clean image, by hand: it repeats CI and
# takes as long, and it only has to hold when the image or toolchain changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit and sandbox tests in the container
        run: scripts/test-container.sh

[package]
name = "sandbox-tests"
description = "near-workspaces tests against the compiled contracts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

[dev-dependencies]
near-workspaces.workspace = true
# For the gas constants only: the tests talk to the contract in JSON.
near-spend-guard = { path = "../contracts/guard" }
near-sdk = { workspace = true, features = ["unit-testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"

[lints]
workspace = true

# A local node that stays up, for a real MCP host (scripts/local-node.sh).
# Its unit tests run with the sandbox tests.
[[example]]
name = "local_node"
test = true
